<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yamasaki Academy - Amazon Product Collection</title>
  <link rel="stylesheet" href="styles/yamasaki_amazon_products.css">
</head>
<body>
  <div class="page-container">
    
    <!-- Header Section -->
    <header class="header">
      <div class="header-text">
        <h1 class="brand-title">YAMASAKI ACADEMY</h1>
        <p class="brand-subtitle">Amazon Product Collection</p>
      </div>
      <div class="logo-container">
        <img src="images/yam_logo.png" alt="Yamasaki Academy Logo" class="brand-logo" width="140" height="140">
      </div>
    </header>

    <main>
      <!-- FIRST SECTION: Kids & Family -->
      <section class="catalog-section">
        <h2 class="section-title">
          <span class="highlight-red">New</span> <span class="highlight-cyan">Kids and Family</span>
        </h2>

        <div class="product-grid">
          
          <!-- Card 1 -->
          <div class="product-card">
            <div class="card-image-wrapper">
              <img src="images/dad_son2.png" alt="Yamasaki Academy Dad and Son T-Shirts" class="product-img" loading="lazy">
            </div>
            <div class="card-action">
              <a href="https://www.amazon.com/dp/B0HM5H197V?" target="_blank" rel="noopener noreferrer" class="btn-amazon">View on Amazon</a>
            </div>
          </div>

          <!-- Card 2 -->
          <div class="product-card">
            <div class="card-image-wrapper">
              <img src="images/family_tees.png" alt="Yamasaki Academy Family Tees Set" class="product-img" loading="lazy">
            </div>
            <div class="card-action">
              <a href="https://www.amazon.com/dp/B0HM51ZVLT?" target="_blank" rel="noopener noreferrer" class="btn-amazon">View on Amazon</a>
            </div>
          </div>

          <!-- Card 3 -->
          <div class="product-card">
            <div class="card-image-wrapper">
              <img src="images/kids_sweatshirzoom.png" alt="Yamasaki Academy Kids Sweatshirt" class="product-img" loading="lazy">
            </div>
            <div class="card-action">
              <a href="https://www.amazon.com/dp/B0HM9NLR28?" target="_blank" rel="noopener noreferrer" class="btn-amazon">View on Amazon</a>
            </div>
          </div>

          <!-- Card 4 (Coming Soon Backpack) -->
          <div class="product-card">
            <div class="card-image-wrapper ribbon-container">
              <span class="ribbon-coming-soon">coming soon</span>
              <img src="images/bp2.png" alt="Yamasaki Academy Backpack" class="product-img" loading="lazy">
            </div>
            <div class="card-action">
              <a href="javascript:void(0);" class="btn-amazon btn-disabled" aria-disabled="true" tabindex="-1">Coming Soon</a>
            </div>
          </div>

        </div>
      </section>

      <!-- SECOND SECTION: Hoodies -->
      <section class="catalog-section hoodie-section">
        <h2 class="section-title">
          <span class="highlight-cyan">Hoodies</span>
        </h2>

        <div class="product-grid">
          
          <!-- Hoodie 1 -->
          <div class="product-card">
            <div class="card-image-wrapper">
              <img src="images/black_hoodie_palletzoom.png" alt="Yamasaki Academy Black Zip Hoodie" class="product-img" loading="lazy">
            </div>
            <div class="card-action">
              <a href="https://www.amazon.com/dp/B0FSFWV2ZR?" target="_blank" rel="noopener noreferrer" class="btn-amazon">View on Amazon</a>
            </div>
          </div>

          <!-- Hoodie 2 -->
          <div class="product-card">
            <div class="card-image-wrapper">
              <img src="images/blue_hoodie_zoom.png" alt="Yamasaki Academy Blue Zip Hoodie" class="product-img" loading="lazy">
            </div>
            <div class="card-action">
              <a href="https://www.amazon.com/dp/B0FKQFFK4H?" target="_blank" rel="noopener noreferrer" class="btn-amazon">View on Amazon</a>
            </div>
          </div>

          <!-- Hoodie 3 -->
          <div class="product-card">
            <div class="card-image-wrapper">
              <img src="images/whitepullover_pallet.png" alt="Yamasaki Academy White Pullover Hoodie" class="product-img" loading="lazy">
            </div>
            <div class="card-action">
              <a href="https://www.amazon.com/dp/B0FT57YL9P?" target="_blank" rel="noopener noreferrer" class="btn-amazon">View on Amazon</a>
            </div>
          </div>

          <!-- Hoodie 4 -->
          <div class="product-card">
            <div class="card-image-wrapper">
              <img src="images/ink_pulloverhoodie.png" alt="Yamasaki Academy Light Ink Pullover Hoodie" class="product-img" loading="lazy">
            </div>
            <div class="card-action">
              <a href="https://www.amazon.com/dp/B0FWKZC2QN?" target="_blank" rel="noopener noreferrer" class="btn-amazon">View on Amazon</a>
            </div>
          </div>

        </div>
      </section>
    </main>

  </div>
</body>
</html>
